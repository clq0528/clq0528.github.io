<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新建异常问题 - 优化布局</title>
<!-- 
https://clq0528.github.io/%E7%9F%A5%E8%AF%86%E5%BA%93/%E6%96%B0%E5%BB%BA%E5%BC%82%E5%B8%B8%E9%97%AE%E9%A2%98%E5%B7%A5%E5%8D%95.html
-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ant-design-icons/4.7.0/font/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .breadcrumb {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            padding: 8px 0;
        }
        
        .breadcrumb span {
            color: #1890ff;
            cursor: pointer;
        }
        
        .breadcrumb span:last-child {
            color: #999;
        }
        
        .form-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }
        
        .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .form-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2d3d;
            display: flex;
            align-items: center;
        }
        
        .form-title i {
            margin-right: 8px;
            color: #1890ff;
        }
        
        .form-content {
            padding: 24px;
        }
        
        .form-section {
            margin-bottom: 32px;
        }
        
        .section-header {
            font-size: 16px;
            font-weight: 600;
            color: #1f2d3d;
            padding-bottom: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f0f0f0;
            position: relative;
        }
        
        .section-header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 60px;
            height: 2px;
            background-color: #1890ff;
        }
        
        .form-row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -12px;
        }
        
        .form-col {
            flex: 0 0 33.3333%;
            max-width: 33.3333%;
            padding: 0 12px;
            margin-bottom: 20px;
        }
        
        .form-col-full {
            flex: 0 0 100%;
            max-width: 100%;
        }
        
        .form-col-half {
            flex: 0 0 50%;
            max-width: 50%;
        }
        
        .form-item {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }
        
        .form-label.required::after {
            content: "*";
            color: #ff4d4f;
            margin-left: 4px;
        }
        
        .form-control {
            width: 100%;
            height: 36px;
            padding: 6px 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
            background-color: #fff;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            outline: none;
            border-color: #1890ff;
            box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.2);
        }
        
        .form-control:disabled {
            background-color: #f5f5f5;
            color: #999;
            cursor: not-allowed;
        }
        
        .form-control.select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
            padding-right: 36px;
        }
        
        .form-textarea {
            min-height: 100px;
            resize: vertical;
        }
        
        .input-group {
            display: flex;
        }
        
        .input-group .form-control:first-child {
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
            border-right: none;
        }
        
        .input-group .form-control:last-child {
            border-top-left-radius: 0;
            border-bottom-left-radius: 0;
        }
        
        .hint-text {
            font-size: 12px;
            color: #999;
            margin-top: 4px;
        }
        
        .tag {
            display: inline-block;
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 4px;
            background-color: #e6f7ff;
            color: #1890ff;
            border: 1px solid #91d5ff;
        }
        
        .form-footer {
            padding: 24px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .button-group {
            display: flex;
            gap: 16px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 28px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 4px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            min-width: 140px;
        }
        
        .btn-primary {
            background-color: #1890ff;
            color: #fff;
        }
        
        .btn-primary:hover {
            background-color: #40a9ff;
        }
        
        .btn-default {
            background-color: #fff;
            color: #333;
            border-color: #d9d9d9;
        }
        
        .btn-default:hover {
            border-color: #1890ff;
            color: #1890ff;
        }
        
        .footer-note {
            margin-top: 16px;
            font-size: 13px;
            color: #fa8c16;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .footer-note i {
            margin-right: 6px;
        }
        
        @media (max-width: 992px) {
            .form-col {
                flex: 0 0 50%;
                max-width: 50%;
            }
        }
        
        @media (max-width: 768px) {
            .form-col, .form-col-half {
                flex: 0 0 100%;
                max-width: 100%;
            }
            
            .form-header, .form-content, .form-footer {
                padding: 16px;
            }
            
            .button-group {
                flex-direction: column;
                width: 100%;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="breadcrumb">
            <span>异常问题管理</span> / <span>异常问题</span> / <span>新建异常问题</span>
        </div>
        
        <div class="form-card">
            <div class="form-header">
                <div class="form-title">
                    <i class="anticon anticon-file-add"></i>
                    新建异常问题工单
                </div>
            </div>
            
            <div class="form-content">
                <form id="issue-form">
                    <!-- 第一部分：基本信息 -->
                    <div class="form-section">
                        <div class="section-header">基本信息</div>
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-item">
                                    <label class="form-label">问题编号</label>
                                    <input type="text" class="form-control" value="Abnorm-20240520-001" disabled>
                                    <div class="hint-text">系统根据当前日期自动生成</div>
                                </div>
                            </div>
                            
                            <div class="form-col">
                                <div class="form-item">
                                    <label class="form-label required">问题类型</label>
                                    <select class="form-control select">
                                        <option value="">请选择问题类型</option>
                                        <option value="现场问题">现场问题</option>
                                        <option value="研发问题">研发问题</option>
                                        <option value="制造问题">制造问题</option>
                                        <option value="质量问题">质量问题</option>
                                        <option value="其他问题">其他问题</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-col">
                                <div class="form-item">
                                    <label class="form-label">当前状态</label>
                                    <div>
                                        <span class="tag">已创建</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-col-half">
                                <div class="form-item">
                                    <label class="form-label">关联来源工单</label>
                                    <div class="input-group">
                                        <select class="form-control">
                                            <option value="故障">故障工单</option>
                                            <option value="技改">技改工单</option>
                                        </select>
                                        <input type="text" class="form-control" placeholder="输入工单号进行关联">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-col-half">
                                <div class="form-item">
                                    <label class="form-label">对应机型</label>
                                    <select class="form-control select">
                                        <option value="">请选择对应机型</option>
                                        <option value="SE11520">SE11520</option>
                                        <option value="SE12030">SE12030</option>
                                        <option value="SE15045">SE15045</option>
                                        <option value="SE20060">SE20060</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 第二部分：内容详述 -->
                    <div class="form-section">
                        <div class="section-header">详情描述</div>
                        <div class="form-row">
                            <div class="form-col-full">
                                <div class="form-item">
                                    <label class="form-label required">问题详细描述</label>
                                    <textarea class="form-control form-textarea" placeholder="请详细描述异常发生的背景、现象及影响..."></textarea>
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-col-full">
                                <div class="form-item">
                                    <label class="form-label">初步处理方案描述</label>
                                    <textarea class="form-control form-textarea" placeholder="如有初步解决方案请在此填入..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 第三部分：人员信息 -->
                    <div class="form-section">
                        <div class="section-header">人员及时间</div>
                        <div class="form-row">
                            <div class="form-col">
                                <div class="form-item">
                                    <label class="form-label required">方案提供人/部门</label>
                                    <input type="text" class="form-control" placeholder="例如：XX部-张三">
                                </div>
                            </div>
                            
                            <div class="form-col">
                                <div class="form-item">
                                    <label class="form-label">问题创建人</label>
                                    <input type="text" class="form-control" value="管理员" disabled>
                                </div>
                            </div>
                            
                            <div class="form-col">
                                <div class="form-item">
                                    <label class="form-label">创建时间</label>
                                    <input type="text" class="form-control" value="2024-05-20 14:00:00" disabled>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="form-footer">
                <div class="button-group">
                    <button type="button" class="btn btn-primary" id="submit-btn">
                        确认并提交至问题库
                    </button>
                    <button type="button" class="btn btn-default" id="cancel-btn">
                        暂不处理
                    </button>
                </div>
                <div class="footer-note">
                    <i class="anticon anticon-info-circle"></i>
                    提交后，该数据将自动进入"20生成问题库"环节等待价值评估
                </div>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 表单提交按钮点击事件
            document.getElementById('submit-btn').addEventListener('click', function() {
                const form = document.getElementById('issue-form');
                const requiredFields = form.querySelectorAll('.required');
                let isValid = true;
                
                // 简单的必填字段验证
                requiredFields.forEach(label => {
                    const field = label.nextElementSibling || label.parentElement.nextElementSibling;
                    if (field && (field.tagName === 'INPUT' || field.tagName === 'SELECT' || field.tagName === 'TEXTAREA')) {
                        if (!field.value.trim()) {
                            field.style.borderColor = '#ff4d4f';
                            isValid = false;
                        } else {
                            field.style.borderColor = '#d9d9d9';
                        }
                    }
                });
                
                if (isValid) {
                    alert('表单验证通过，正在提交...');
                    // 这里可以添加实际的表单提交逻辑
                } else {
                    alert('请填写所有必填字段（标有*的字段）');
                }
            });
            
            // 暂不处理按钮点击事件
            document.getElementById('cancel-btn').addEventListener('click', function() {
                if (confirm('确定要暂不处理此工单吗？')) {
                    alert('工单已保存为草稿');
                    // 这里可以添加保存草稿的逻辑
                }
            });
            
            // 输入框聚焦/失焦样式
            const formControls = document.querySelectorAll('.form-control');
            formControls.forEach(control => {
                control.addEventListener('focus', function() {
                    this.style.borderColor = '#1890ff';
                    this.style.boxShadow = '0 0 0 2px rgba(24, 144, 255, 0.2)';
                });
                
                control.addEventListener('blur', function() {
                    this.style.borderColor = '#d9d9d9';
                    this.style.boxShadow = 'none';
                });
            });
            
            // 模拟当前时间
            const now = new Date();
            const formattedTime = now.getFullYear() + '-' + 
                                String(now.getMonth() + 1).padStart(2, '0') + '-' + 
                                String(now.getDate()).padStart(2, '0') + ' ' + 
                                String(now.getHours()).padStart(2, '0') + ':' + 
                                String(now.getMinutes()).padStart(2, '0') + ':' + 
                                String(now.getSeconds()).padStart(2, '0');
            
            const timeInput = document.querySelector('input[value="2024-05-20 14:00:00"]');
            if (timeInput) {
                timeInput.value = formattedTime;
            }
        });
    </script>
</body>
</html>
