<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锂电池PACK自动化U型产线 - 数字孪生系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif; 
            background: #050505; 
            color: #fff;
            overflow: hidden;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* 左侧工艺步骤面板 */
        .process-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            width: 300px;
            border: 1px solid rgba(0, 243, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 100;
        }
        
        .process-panel h2 {
            color: #00f3ff;
            margin-bottom: 20px;
            font-weight: 300;
            font-size: 20px;
            letter-spacing: 1px;
            text-align: center;
        }
        
        .process-step {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 12px 15px;
            background: rgba(20, 30, 50, 0.6);
            border-radius: 8px;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
        }
        
        .process-step.active {
            background: rgba(0, 243, 255, 0.1);
            border-left-color: #00f3ff;
        }
        
        .step-number {
            width: 28px;
            height: 28px;
            background: #1a2a3a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-weight: bold;
            color: #00f3ff;
        }
        
        .step-info h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .step-info p {
            font-size: 12px;
            color: #a0b0c0;
        }
        
        /* 右上角信息面板 */
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 20px;
            width: 280px;
            border: 1px solid rgba(255, 100, 0, 0.3);
        }
        
        .info-panel h3 {
            color: #ff6600;
            margin-bottom: 15px;
            font-weight: 300;
        }
        
        .stats {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-value {
            color: #00ffaa;
            font-weight: 500;
        }
        
        /* 底部图例 */
        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 20px;
            background: rgba(0, 10, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            border-radius: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .color-box {
            width: 16px;
            height: 16px;
            border-radius: 3px;
        }
        
        /* 控制提示 */
        .controls-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 10, 20, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 12px;
            color: #a0b0c0;
        }
        
        /* 进度指示器 */
        .progress-indicator {
            position: absolute;
            bottom: 80px;
            right: 20px;
            width: 200px;
        }
        
        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0066ff, #00ffaa);
            width: 75%;
            transition: width 0.3s ease;
        }
        
        .progress-text {
            font-size: 12px;
            color: #a0b0c0;
            text-align: right;
        }
        
        /* 加载界面 */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #050505;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loader {
            width: 60px;
            height: 60px;
            border: 3px solid transparent;
            border-top-color: #00f3ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 加载界面 -->
    <div id="loading-screen">
        <div class="loader"></div>
        <div style="color: #00f3ff; font-size: 18px; margin-bottom: 10px;">加载数字孪生系统...</div>
        <div style="color: #a0b0c0; font-size: 14px;">初始化锂电池PACK产线模型</div>
    </div>
    
    <!-- 3D画布容器 -->
    <div id="canvas-container"></div>
    
    <!-- 左侧工艺步骤面板 -->
    <div class="process-panel">
        <h2>锂电池PACK自动化产线工艺流</h2>
        <div class="process-step active" data-step="1">
            <div class="step-number">1</div>
            <div class="step-info">
                <h3>电芯成组</h3>
                <p>电芯排序、检测、组装成模组</p>
            </div>
        </div>
        <div class="process-step" data-step="2">
            <div class="step-number">2</div>
            <div class="step-info">
                <h3>模组焊接</h3>
                <p>激光焊接、CCD检测、焊后检测</p>
            </div>
        </div>
        <div class="process-step" data-step="3">
            <div class="step-number">3</div>
            <div class="step-info">
                <h3>模组测试</h3>
                <p>EOL测试、绝缘测试、性能测试</p>
            </div>
        </div>
        <div class="process-step" data-step="4">
            <div class="step-number">4</div>
            <div class="step-info">
                <h3>模组入箱</h3>
                <p>箱体装配、紧固、密封性检测</p>
            </div>
        </div>
        <div class="process-step" data-step="5">
            <div class="step-number">5</div>
            <div class="step-info">
                <h3>PACK测试</h3>
                <p>总成测试、气密性检测、终检</p>
            </div>
        </div>
    </div>
    
    <!-- 右上角信息面板 -->
    <div class="info-panel">
        <h3>产线实时数据</h3>
        <div class="stats">
            <div class="stat-item">
                <span>当前状态:</span>
                <span class="stat-value" id="status">运行中</span>
            </div>
            <div class="stat-item">
                <span>生产节拍:</span>
                <span class="stat-value" id="cycle-time">45秒/PACK</span>
            </div>
            <div class="stat-item">
                <span>设备OEE:</span>
                <span class="stat-value" id="oee">92.5%</span>
            </div>
            <div class="stat-item">
                <span>今日产量:</span>
                <span class="stat-value" id="output">342件</span>
            </div>
            <div class="stat-item">
                <span>良品率:</span>
                <span class="stat-value" id="yield">99.2%</span>
            </div>
        </div>
    </div>
    
    <!-- 底部图例 -->
    <div class="legend">
        <div class="legend-item">
            <div class="color-box" style="background: #0066ff;"></div>
            <span>电芯</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #00ffaa;"></div>
            <span>焊接模组</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #ff6600;"></div>
            <span>工业机器人</span>
        </div>
        <div class="legend-item">
            <div class="color-box" style="background: #444444; border: 1px solid #777;"></div>
            <span>成品PACK</span>
        </div>
    </div>
    
    <!-- 进度指示器 -->
    <div class="progress-indicator">
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        <div class="progress-text">生产进度: 342/500</div>
    </div>
    
    <!-- 控制提示 -->
    <div class="controls-hint">
        鼠标: 左键旋转 · 右键平移 · 滚轮缩放
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@0.160.0",
                "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        
        // 隐藏加载界面
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 1500);
        
        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(35, 25, 40);
        
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true, 
            alpha: true 
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        
        document.getElementById('canvas-container').appendChild(renderer.domElement);
        
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 10;
        controls.maxDistance = 100;
        controls.maxPolarAngle = Math.PI * 0.8;
        
        const pmremGenerator = new THREE.PMREMGenerator(renderer);
        scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        scene.background = new THREE.Color(0x050505);
        
        // --- 工业材质定义 ---
        const mats = {
            frame: new THREE.MeshStandardMaterial({ 
                color: 0x2c3e50, 
                metalness: 0.8, 
                roughness: 0.2 
            }),
            robot: new THREE.MeshStandardMaterial({ 
                color: 0xff6600, 
                metalness: 0.7, 
                roughness: 0.3 
            }),
            conveyor: new THREE.MeshStandardMaterial({ 
                color: 0x333333, 
                metalness: 0.9, 
                roughness: 0.4 
            }),
            cell: new THREE.MeshStandardMaterial({ 
                color: 0x0066ff, 
                metalness: 0.6, 
                roughness: 0.3,
                emissive: 0x001133,
                emissiveIntensity: 0.3
            }),
            module: new THREE.MeshStandardMaterial({ 
                color: 0x00ffaa, 
                metalness: 0.7, 
                roughness: 0.2 
            }),
            pack: new THREE.MeshStandardMaterial({ 
                color: 0x222222, 
                metalness: 0.8, 
                roughness: 0.4 
            }),
            glass: new THREE.MeshPhysicalMaterial({ 
                color: 0x00ffff, 
                transparent: true, 
                opacity: 0.15,
                transmission: 0.9,
                roughness: 0.1,
                metalness: 0
            }),
            floor: new THREE.MeshStandardMaterial({ 
                color: 0x111111, 
                metalness: 0.1, 
                roughness: 0.8 
            })
        };
        
        // --- 建模组件库 ---
        
        // 1. 6轴工业机器人
        function createRobotArm(position = {x: 0, y: 0, z: 0}) {
            const group = new THREE.Group();
            
            // 底座
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.8, 1, 0.6, 16),
                mats.robot
            );
            base.position.y = 0.3;
            group.add(base);
            
            // 第一关节
            const joint1 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.4, 0.5, 1.2, 12),
                mats.robot
            );
            joint1.position.y = 1.2;
            group.add(joint1);
            
            // 第二关节
            const joint2 = new THREE.Mesh(
                new THREE.BoxGeometry(0.5, 0.5, 1.8),
                mats.robot
            );
            joint2.position.set(0, 2.2, 0.8);
            group.add(joint2);
            
            // 第三关节
            const joint3 = new THREE.Mesh(
                new THREE.CylinderGeometry(0.3, 0.3, 1.2, 12),
                mats.robot
            );
            joint3.position.set(0, 2.8, 1.8);
            group.add(joint3);
            
            // 夹具
            const gripper = new THREE.Group();
            const gripperBase = new THREE.Mesh(
                new THREE.BoxGeometry(0.6, 0.2, 0.4),
                mats.frame
            );
            const gripperLeft = new THREE.Mesh(
                new THREE.BoxGeometry(0.1, 0.3, 0.3),
                mats.frame
            );
            gripperLeft.position.set(-0.2, -0.2, 0);
            const gripperRight = gripperLeft.clone();
            gripperRight.position.set(0.2, -0.2, 0);
            
            gripper.add(gripperBase, gripperLeft, gripperRight);
            gripper.position.set(0, 3.4, 1.8);
            group.add(gripper);
            
            group.position.set(position.x, position.y, position.z);
            group.userData.rotation = 0;
            
            return group;
        }
        
        // 2. 输送带
        function createConveyor(length, width = 1.2, hasRollers = true) {
            const group = new THREE.Group();
            
            // 主体
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(length, 0.3, width),
                mats.conveyor
            );
            body.position.y = 0.15;
            group.add(body);
            
            // 支架
            const legPositions = [
                [-length/2 + 0.5, -0.45], [length/2 - 0.5, -0.45],
                [-length/2 + 0.5, 0.45], [length/2 - 0.5, 0.45]
            ];
            
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(
                    new THREE.BoxGeometry(0.15, 0.9, 0.15),
                    mats.frame
                );
                leg.position.set(pos[0], 0.45, pos[1] * width);
                group.add(leg);
            });
            
            // 滚轮
            if (hasRollers) {
                for (let i = 0; i < Math.floor(length / 0.8); i++) {
                    const roller = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.08, 0.08, width - 0.2, 8),
                        mats.frame
                    );
                    roller.rotation.z = Math.PI / 2;
                    roller.position.set(-length/2 + 0.4 + i * 0.8, 0.3, 0);
                    group.add(roller);
                }
            }
            
            return group;
        }
        
        // 3. 自动化工作站
        function createStation(type, position = {x: 0, y: 0, z: 0}) {
            const group = new THREE.Group();
            
            // 工作台
            const table = new THREE.Mesh(
                new THREE.BoxGeometry(3, 0.8, 2.5),
                mats.frame
            );
            table.position.y = 0.4;
            group.add(table);
            
            // 防护罩框架
            const frameHeight = type === 'welding' ? 3.5 : 2.8;
            const posts = [
                [-1.2, -0.8], [1.2, -0.8], [-1.2, 0.8], [1.2, 0.8]
            ];
            
            posts.forEach(pos => {
                const post = new THREE.Mesh(
                    new THREE.BoxGeometry(0.1, frameHeight, 0.1),
                    mats.frame
                );
                post.position.set(pos[0], frameHeight/2, pos[1]);
                group.add(post);
            });
            
            // 顶部框架
            const topFrame = new THREE.Mesh(
                new THREE.BoxGeometry(2.6, 0.1, 1.8),
                mats.frame
            );
            topFrame.position.y = frameHeight;
            group.add(topFrame);
            
            // 防护玻璃
            const glass = new THREE.Mesh(
                new THREE.BoxGeometry(2.4, frameHeight - 0.5, 0.1),
                mats.glass
            );
            glass.position.set(0, frameHeight/2 + 0.3, 0.9);
            group.add(glass);
            
            // 根据工作站类型添加设备
            if (type === 'welding') {
                // 激光焊接头
                const laser = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.1, 0.15, 0.5, 8),
                    new THREE.MeshStandardMaterial({ color: 0xff0000, metalness: 0.8 })
                );
                laser.position.set(0, frameHeight - 0.3, 0);
                laser.rotation.x = Math.PI / 2;
                group.add(laser);
                
                // CCD相机
                const camera = new THREE.Mesh(
                    new THREE.BoxGeometry(0.2, 0.15, 0.15),
                    new THREE.MeshStandardMaterial({ color: 0x333333 })
                );
                camera.position.set(0.5, frameHeight - 0.5, 0.3);
                group.add(camera);
            } 
            else if (type === 'testing') {
                // 测试探针
                const probe1 = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.05, 0.05, 0.3, 8),
                    new THREE.MeshStandardMaterial({ color: 0xffff00 })
                );
                probe1.position.set(-0.5, 1.5, 0);
                group.add(probe1);
                
                const probe2 = probe1.clone();
                probe2.position.set(0.5, 1.5, 0);
                group.add(probe2);
                
                // 显示屏
                const screen = new THREE.Mesh(
                    new THREE.PlaneGeometry(0.8, 0.6),
                    new THREE.MeshBasicMaterial({ 
                        color: 0x00ff00,
                        emissive: 0x003300,
                        emissiveIntensity: 0.5
                    })
                );
                screen.position.set(0, frameHeight - 0.2, 0.91);
                screen.rotation.x = -0.2;
                group.add(screen);
            }
            else if (type === 'assembly') {
                // 装配夹具
                const fixture = new THREE.Mesh(
                    new THREE.BoxGeometry(1.5, 0.4, 1),
                    mats.frame
                );
                fixture.position.set(0, 0.9, 0);
                group.add(fixture);
                
                // 拧紧轴
                const screwDriver = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8),
                    new THREE.MeshStandardMaterial({ color: 0xcccccc })
                );
                screwDriver.position.set(0, 2, 0);
                group.add(screwDriver);
            }
            
            group.position.set(position.x, position.y, position.z);
            return group;
        }
        
        // 4. 货架/线边库
        function createRack(capacity, itemType, position = {x: 0, y: 0, z: 0}) {
            const group = new THREE.Group();
            
            // 货架框架
            const frame = new THREE.Mesh(
                new THREE.BoxGeometry(2, 3, 1),
                mats.frame
            );
            frame.position.y = 1.5;
            group.add(frame);
            
            // 层板
            for (let i = 1; i <= 3; i++) {
                const shelf = new THREE.Mesh(
                    new THREE.BoxGeometry(1.9, 0.05, 0.9),
                    mats.frame
                );
                shelf.position.y = i * 0.8;
                group.add(shelf);
            }
            
            // 物料
            let material, size;
            switch(itemType) {
                case 'cell':
                    material = mats.cell;
                    size = {x: 0.4, y: 0.2, z: 0.3};
                    break;
                case 'module':
                    material = mats.module;
                    size = {x: 0.8, y: 0.4, z: 0.6};
                    break;
                case 'pack':
                    material = mats.pack;
                    size = {x: 1.5, y: 0.6, z: 0.8};
                    break;
            }
            
            for (let i = 0; i < Math.min(capacity, 6); i++) {
                const item = new THREE.Mesh(
                    new THREE.BoxGeometry(size.x, size.y, size.z),
                    material
                );
                
                const row = Math.floor(i / 2);
                const col = i % 2;
                item.position.set(
                    col * 0.6 - 0.3,
                    (row + 1) * 0.8 - 0.3,
                    0
                );
                group.add(item);
            }
            
            group.position.set(position.x, position.y, position.z);
            return group;
        }
        
        // 5. 电芯（蓝色方块）
        function createCell(position = {x: 0, y: 0, z: 0}) {
            const cell = new THREE.Mesh(
                new THREE.BoxGeometry(0.4, 0.2, 0.3),
                mats.cell
            );
            cell.position.set(position.x, position.y, position.z);
            cell.userData.type = 'cell';
            return cell;
        }
        
        // 6. 电池模组
        function createModule(position = {x: 0, y: 0, z: 0}) {
            const group = new THREE.Group();
            
            // 模组主体
            const module = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.4, 0.6),
                mats.module
            );
            group.add(module);
            
            // 电芯（模组由电芯组成）
            for (let i = 0; i < 4; i++) {
                for (let j = 0; j < 2; j++) {
                    const cell = new THREE.Mesh(
                        new THREE.BoxGeometry(0.18, 0.18, 0.25),
                        mats.cell
                    );
                    cell.position.set(
                        i * 0.2 - 0.3,
                        j * 0.2 - 0.1,
                        0
                    );
                    group.add(cell);
                }
            }
            
            // 汇流排
            const busbar = new THREE.Mesh(
                new THREE.BoxGeometry(0.7, 0.05, 0.1),
                new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 1 })
            );
            busbar.position.set(0, 0.25, 0.3);
            group.add(busbar);
            
            group.position.set(position.x, position.y, position.z);
            group.userData.type = 'module';
            return group;
        }
        
        // 7. 电池PACK
        function createPack(position = {x: 0, y: 0, z: 0}) {
            const pack = new THREE.Mesh(
                new THREE.BoxGeometry(1.5, 0.6, 0.8),
                mats.pack
            );
            
            // 添加一些细节
            const geometry = new THREE.BoxGeometry(1.4, 0.1, 0.7);
            const material = new THREE.MeshStandardMaterial({ 
                color: 0x666666, 
                metalness: 0.9 
            });
            const cover = new THREE.Mesh(geometry, material);
            cover.position.y = 0.35;
            
            const connector = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.08, 0.15, 8),
                new THREE.MeshStandardMaterial({ color: 0xffaa00 })
            );
            connector.position.set(0.6, 0.3, 0.4);
            
            const group = new THREE.Group();
            group.add(pack, cover, connector);
            group.position.set(position.x, position.y, position.z);
            group.userData.type = 'pack';
            
            return group;
        }
        
        // --- 构建U型产线布局 ---
        
        // 地面
        const ground = new THREE.Mesh(
            new THREE.PlaneGeometry(60, 60),
            mats.floor
        );
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // 网格
        const grid = new THREE.GridHelper(60, 60, 0x222222, 0x111111);
        scene.add(grid);
        
        // 主产线组
        const productionLine = new THREE.Group();
        
        // 区域1: 右侧上料区（电芯成组）
        const zone1 = new THREE.Group();
        zone1.position.set(15, 0, 0);
        
        // 上料机器人
        const loadingRobot = createRobotArm({x: 2, y: 0, z: 5});
        zone1.add(loadingRobot);
        
        // 上料输送带
        const loadingConveyor = createConveyor(8);
        loadingConveyor.rotation.y = Math.PI / 2;
        zone1.add(loadingConveyor);
        
        // 电芯货架
        const cellRack1 = createRack(6, 'cell', {x: 5, y: 0, z: 3});
        const cellRack2 = createRack(6, 'cell', {x: 5, y: 0, z: -3});
        zone1.add(cellRack1, cellRack2);
        
        // 电芯成组工作站
        const cellGroupingStation = createStation('assembly', {x: 0, y: 0, z: 0});
        zone1.add(cellGroupingStation);
        
        productionLine.add(zone1);
        
        // 区域2: 顶部焊接区
        const zone2 = new THREE.Group();
        zone2.position.set(0, 0, -15);
        
        // 模组焊接工作站
        const weldingStation1 = createStation('welding', {x: -5, y: 0, z: 0});
        const weldingStation2 = createStation('welding', {x: 5, y: 0, z: 0});
        zone2.add(weldingStation1, weldingStation2);
        
        // 焊接机器人
        const weldingRobot1 = createRobotArm({x: -5, y: 0, z: 3});
        const weldingRobot2 = createRobotArm({x: 5, y: 0, z: 3});
        zone2.add(weldingRobot1, weldingRobot2);
        
        // 输送带
        const weldingConveyor = createConveyor(12);
        zone2.add(weldingConveyor);
        
        productionLine.add(zone2);
        
        // 区域3: 测试区
        const zone3 = new THREE.Group();
        zone3.position.set(-8, 0, 0);
        
        // 测试工作站
        for (let i = 0; i < 3; i++) {
            const testStation = createStation('testing', {x: i * 3.5, y: 0, z: 0});
            zone3.add(testStation);
        }
        
        // 测试输送带
        const testConveyor = createConveyor(8);
        testConveyor.position.z = 2;
        zone3.add(testConveyor);
        
        productionLine.add(zone3);
        
        // 区域4: 左侧装配区（模组入箱）
        const zone4 = new THREE.Group();
        zone4.position.set(-15, 0, 8);
        
        // 装配机器人
        const assemblyRobot = createRobotArm({x: 0, y: 0, z: 0});
        assemblyRobot.scale.set(1.2, 1.2, 1.2);
        zone4.add(assemblyRobot);
        
        // 装配工作站
        const assemblyStation = createStation('assembly', {x: 3, y: 0, z: 0});
        zone4.add(assemblyStation);
        
        // 箱体货架
        const packRack = createRack(4, 'pack', {x: -3, y: 0, z: 2});
        zone4.add(packRack);
        
        productionLine.add(zone4);
        
        // 区域5: 底部下料区（PACK测试）
        const zone5 = new THREE.Group();
        zone5.position.set(0, 0, 15);
        
        // 终检工作站
        const finalTestStation = createStation('testing', {x: 0, y: 0, z: 0});
        zone5.add(finalTestStation);
        
        // 成品输送带
        const finalConveyor = createConveyor(10, 1.5);
        finalConveyor.rotation.y = Math.PI / 2;
        finalConveyor.position.z = 2;
        zone5.add(finalConveyor);
        
        // 成品缓存区
        for (let i = 0; i < 4; i++) {
            const pack = createPack({x: -5 + i * 3, y: 0.5, z: 5});
            zone5.add(pack);
        }
        
        productionLine.add(zone5);
        
        // 连接各区域的输送带
        const mainConveyor1 = createConveyor(15);
        mainConveyor1.position.set(7.5, 0, 0);
        productionLine.add(mainConveyor1);
        
        const mainConveyor2 = createConveyor(15);
        mainConveyor2.rotation.y = Math.PI / 2;
        mainConveyor2.position.set(0, 0, -7.5);
        productionLine.add(mainConveyor2);
        
        const mainConveyor3 = createConveyor(15);
        mainConveyor3.position.set(-7.5, 0, 0);
        productionLine.add(mainConveyor3);
        
        const mainConveyor4 = createConveyor(15);
        mainConveyor4.rotation.y = Math.PI / 2;
        mainConveyor4.position.set(0, 0, 7.5);
        productionLine.add(mainConveyor4);
        
        scene.add(productionLine);
        
        // --- 物料流动动画 ---
        const movingItems = [];
        
        function spawnMovingItem(type, startPos, targetPos, speed = 0.005) {
            let item;
            
            switch(type) {
                case 'cell':
                    item = createCell(startPos);
                    break;
                case 'module':
                    item = createModule(startPos);
                    break;
                case 'pack':
                    item = createPack(startPos);
                    break;
            }
            
            scene.add(item);
            movingItems.push({
                mesh: item,
                startPos: startPos.clone(),
                targetPos: targetPos.clone(),
                progress: 0,
                speed: speed,
                type: type
            });
            
            return item;
        }
        
        // 初始化一些物料
        setTimeout(() => {
            // 电芯从仓库移动到成组区
            spawnMovingItem('cell', 
                new THREE.Vector3(18, 1, 3), 
                new THREE.Vector3(10, 1, 0)
            );
            
            // 模组从焊接区移动到测试区
            spawnMovingItem('module',
                new THREE.Vector3(5, 1, -12),
                new THREE.Vector3(-8, 1, -5)
            );
            
            // 模组从测试区移动到装配区
            spawnMovingItem('module',
                new THREE.Vector3(-8, 1, 5),
                new THREE.Vector3(-12, 1, 8)
            );
            
            // 成品PACK从装配区移动到下料区
            spawnMovingItem('pack',
                new THREE.Vector3(-12, 1, 12),
                new THREE.Vector3(0, 1, 12)
            );
        }, 1000);
        
        // --- 灯光设置 ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(20, 40, 20);
        directionalLight.castShadow = true;
        directionalLight.shadow.camera.left = -20;
        directionalLight.shadow.camera.right = 20;
        directionalLight.shadow.camera.top = 20;
        directionalLight.shadow.camera.bottom = -20;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        scene.add(directionalLight);
        
        const blueLight = new THREE.PointLight(0x0066ff, 1, 20);
        blueLight.position.set(15, 10, 0);
        scene.add(blueLight);
        
        const greenLight = new THREE.PointLight(0x00ffaa, 1, 20);
        greenLight.position.set(-5, 10, -15);
        scene.add(greenLight);
        
        const orangeLight = new THREE.PointLight(0xff6600, 1, 20);
        orangeLight.position.set(-15, 10, 8);
        scene.add(orangeLight);
        
        // --- 动画循环 ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            
            time += 0.016;
            
            // 物料流动
            movingItems.forEach((item, index) => {
                item.progress += item.speed;
                if (item.progress > 1) {
                    scene.remove(item.mesh);
                    movingItems.splice(index, 1);
                    
                    // 生成新的物料
                    if (item.type === 'cell') {
                        setTimeout(() => {
                            spawnMovingItem('module',
                                new THREE.Vector3(5, 1, -12),
                                new THREE.Vector3(-8, 1, -5)
                            );
                        }, 1000);
                    } else if (item.type === 'module') {
                        setTimeout(() => {
                            spawnMovingItem('pack',
                                new THREE.Vector3(-12, 1, 12),
                                new THREE.Vector3(0, 1, 12)
                            );
                        }, 1000);
                    } else if (item.type === 'pack') {
                        setTimeout(() => {
                            spawnMovingItem('cell',
                                new THREE.Vector3(18, 1, 3),
                                new THREE.Vector3(10, 1, 0)
                            );
                        }, 1000);
                    }
                } else {
                    const pos = new THREE.Vector3();
                    pos.lerpVectors(item.startPos, item.targetPos, item.progress);
                    pos.y = item.startPos.y + Math.sin(item.progress * Math.PI) * 0.5;
                    item.mesh.position.copy(pos);
                    
                    // 轻微旋转
                    item.mesh.rotation.y += 0.01;
                }
            });
            
            // 机器人动画
            productionLine.traverse((obj) => {
                if (obj.userData && obj.userData.type === 'robot') {
                    obj.rotation.y = Math.sin(time) * 0.1;
                }
                
                if (obj.type === 'Group' && obj.children.length > 0) {
                    obj.children.forEach(child => {
                        if (child.name === 'joint1') {
                            child.rotation.z = Math.sin(time * 0.5) * 0.3;
                        }
                        if (child.name === 'joint2') {
                            child.rotation.x = Math.sin(time * 0.7) * 0.2;
                        }
                    });
                }
            });
            
            // 更新控制步骤高亮
            const progress = (time % 10) / 10;
            const activeStep = Math.floor(progress * 5) + 1;
            
            document.querySelectorAll('.process-step').forEach(step => {
                step.classList.remove('active');
                if (parseInt(step.dataset.step) === activeStep) {
                    step.classList.add('active');
                }
            });
            
            controls.update();
            renderer.render(scene, camera);
        }
        
        // --- 窗口调整 ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        // --- 启动动画 ---
        animate();
        
        // --- 交互功能 ---
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        
        window.addEventListener('click', (event) => {
            // 计算鼠标位置
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            
            // 更新射线
            raycaster.setFromCamera(mouse, camera);
            
            // 计算物体和射线的焦点
            const intersects = raycaster.intersectObjects(scene.children, true);
            
            if (intersects.length > 0) {
                const object = intersects[0].object;
                
                // 高亮被点击的物体
                if (object.material && object.material.emissive) {
                    object.material.emissive.setHex(0xffff00);
                    object.material.emissiveIntensity = 0.5;
                    
                    setTimeout(() => {
                        if (object.material.emissive) {
                            object.material.emissive.setHex(0x000000);
                            object.material.emissiveIntensity = 0;
                        }
                    }, 1000);
                }
            }
        });
        
        // 键盘控制
        window.addEventListener('keydown', (event) => {
            switch(event.key) {
                case '1':
                    camera.position.set(35, 25, 40);
                    camera.lookAt(0, 0, 0);
                    break;
                case '2':
                    camera.position.set(0, 40, 0);
                    camera.lookAt(0, 0, 0);
                    break;
                case '3':
                    camera.position.set(0, 10, 50);
                    camera.lookAt(0, 0, 0);
                    break;
                case ' ':
                    // 暂停/继续动画
                    animate = animate ? null : () => {
                        requestAnimationFrame(animate);
                        controls.update();
                        renderer.render(scene, camera);
                    };
                    if (animate) requestAnimationFrame(animate);
                    break;
            }
        });
        
        console.log('锂电池PACK自动化U型产线数字孪生系统已加载');
        console.log('控制方式:');
        console.log('1. 鼠标: 左键旋转视角，右键平移，滚轮缩放');
        console.log('2. 键盘: 1-预设视角1，2-俯视图，3-预设视角3，空格-暂停/继续');
    </script>
</body>
</html>
